<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mana Capitol - Asset Requests</title>
    <style>
        :root {
            --primary: #4F46E5; /* Indigo */
            --primary-hover: #4338ca;
            --surface: #ffffff;
            --background: #f3f4f6;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            padding: 1.25rem 1rem;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 800px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }

        #loader {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Summary Table */
        .table-wrapper {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            display: none; /* Hidden until data loads */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #f9fafb;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-main);
        }

        tbody tr {
            transition: background-color 0.2s ease;
            cursor: pointer;
        }

        tbody tr:hover, tbody tr:active {
            background-color: #f3f6ff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            line-height: 1;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .close-btn:hover {
            background-color: var(--background);
            color: var(--text-main);
        }

        .modal-body {
            padding: 0;
            overflow-y: auto;
        }

        /* Detail Table inside Modal */
        .detail-table {
            width: 100%;
        }
        
        .detail-table td {
            padding: 0.85rem 1.25rem;
        }

        .detail-table td:first-child {
            font-weight: 600;
            color: var(--text-muted);
            width: 35%;
            background-color: #f9fafb;
            border-right: 1px solid var(--border);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mana Capitol Asset Requests</h1>
    </header>

    <div class="container">
        <div id="loader">Fetching latest requests...</div>
        
        <div class="table-wrapper" id="table-wrapper">
            <table id="main-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Flat No.</th>
                        <th>Name</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Rows will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Popup -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Request Details</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <table class="detail-table">
                    <tbody id="modal-table-body">
                        <!-- Details injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const sheetId = '1BlwK10DHJU7kFdtn6pg9VvZ9v6HNc8bzrHSLdsejXFg';
        const gid = '705406057';
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=${gid}`;

        async function fetchSheetData() {
            try {
                const response = await fetch(url);
                const text = await response.text();
                const jsonString = text.match(/(?<=.*\().*(?=\);)/s)[0];
                const data = JSON.parse(jsonString);
                renderMainTable(data);
            } catch (error) {
                document.getElementById('loader').innerText = "Error loading data. Please check connection.";
                console.error(error);
            }
        }

        function getCellValue(cell) {
            if (!cell) return '-';
            return cell.f || cell.v || '-';
        }

        function renderMainTable(data) {
            const columns = data.table.cols.map(col => col ? col.label : '');
            const rows = data.table.rows;
            const tbody = document.getElementById('table-body');
            
            document.getElementById('loader').style.display = 'none';
            document.getElementById('table-wrapper').style.display = 'block';

            // Attempt to automatically find the correct columns based on common names
            // If it can't find exact names, it defaults to the first 3 columns (0, 1, 2)
            const dateIdx = Math.max(0, columns.findIndex(c => c.toLowerCase().includes('date') || c.toLowerCase().includes('timestamp')));
            const flatIdx = Math.max(1, columns.findIndex(c => c.toLowerCase().includes('flat') || c.toLowerCase().includes('unit')));
            const nameIdx = Math.max(2, columns.findIndex(c => c.toLowerCase().includes('name')));

            rows.forEach(row => {
                if (!row.c || row.c.every(cell => cell === null)) return;

                const tr = document.createElement('tr');
                
                const dateVal = getCellValue(row.c[dateIdx]);
                const flatVal = getCellValue(row.c[flatIdx]);
                const nameVal = getCellValue(row.c[nameIdx]);

                tr.innerHTML = `
                    <td>${dateVal}</td>
                    <td><strong>${flatVal}</strong></td>
                    <td>${nameVal}</td>
                `;

                // Add click event to open modal with full row data
                tr.onclick = () => openModal(row.c, columns);
                tbody.appendChild(tr);
            });
        }

        function openModal(rowData, columns) {
            const modalTableBody = document.getElementById('modal-table-body');
            modalTableBody.innerHTML = ''; // Clear previous data

            columns.forEach((colName, index) => {
                if (!colName) return; // Skip empty columns
                
                const cellValue = getCellValue(rowData[index]);
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${colName}</td>
                    <td>${cellValue}</td>
                `;
                modalTableBody.appendChild(tr);
            });

            const modal = document.getElementById('modal');
            modal.style.display = 'flex';
            // Small delay to allow CSS transition to apply
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300); // Wait for transition
        }

        // Close modal if user clicks outside the white box
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Initialize
        fetchSheetData();
    </script>
</body>
</html>
